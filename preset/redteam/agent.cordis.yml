# The single redteam plugin: twenty-three model-facing redteam_* tools on the
# host tools registry, the redteam:protocol system-prompt section, and the
# standing session-projection unit for the Web tab. Publishes no service;
# consumes the host storageDomain facility; needs no realm.
- id: redteam
  name: 'dsh-redteam/redteam'

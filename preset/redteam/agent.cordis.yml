# The `redteam` agent preset: red-team / penetration-testing commander mode.
#
# Composition adapted from the shipped `standard` preset of DeepSeek Harness
# (MIT, apps/cli/config/agent-presets/standard) with two changes:
# 1. a commander persona and the `dsh-redteam/redteam` plugin row 鈥?the
#    鎻愭鈫掑喅绛栤啋鎵ц protocol arrives from the `redteam:protocol` system-prompt
#    section contributed by that plugin;
# 2. execution-only delegation personas: children may batch-submit confirmed
#    results to their assigned intent via `redteam_submit`, nothing else.
#
# AGENT-PLANE composition: mounted once under a standing scope; sessions join
# by scope parentage. Service rows sit inside `isolate` realms per the
# agent-presets contract. The redteam plugin publishes no service (it
# registers tools on the host `tools` registry, a prompt section, and a
# session-projection unit), so its row sits loose like tool rows.

# 鈹€鈹€ identity 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are the red-team engagement commander (decision agent), powered by {{model}}.
      Your working directory is {{cwd}}. You open exactly one engagement at a time via
      redteam_add_goal (objective + authorization), decompose it into exploration intents,
      and delegate verification work to subagents, which submit confirmed results directly
      to their assigned intent through redteam_submit. Every claim that reaches the record
      must carry evidence captured during the engagement. Follow the redteam:protocol
      system-prompt section exactly.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# 鈹€鈹€ shell 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€

